{{ define "main" }}
<header class="page-header">
    <h1>{{ .Title }}</h1>
    <button class="sidebar-toggle" id="searchSidebarToggle" type="button" aria-label="Toggle sidebar" aria-expanded="false">≡</button>
</header>

<section class="search-page" aria-labelledby="search-label">
    <form class="search-page-form" role="search" onsubmit="return false;">
        <label id="search-label" class="sr-only" for="searchInput">Search notes</label>
        <span class="search-page-icon" aria-hidden="true">{{ partial "helper/icon" "search" }}</span>
        <input type="search" id="searchInput" placeholder="Search notes..." autocomplete="off" spellcheck="false">
    </form>
    <div id="searchStatus" class="search-status" role="status" aria-live="polite"></div>
    <div id="searchResults" class="search-results"></div>
</section>

<script>
(function() {
    var searchData = [];
    var input = document.getElementById('searchInput');
    var status = document.getElementById('searchStatus');
    var results = document.getElementById('searchResults');
    var timer;

    function appendHighlightedText(parent, text, query) {
        var lowerText = text.toLowerCase();
        var lowerQuery = query.toLowerCase();
        var cursor = 0;
        var index = lowerText.indexOf(lowerQuery);

        while (index !== -1) {
            parent.appendChild(document.createTextNode(text.slice(cursor, index)));
            var mark = document.createElement('mark');
            mark.textContent = text.slice(index, index + query.length);
            parent.appendChild(mark);
            cursor = index + query.length;
            index = lowerText.indexOf(lowerQuery, cursor);
        }
        parent.appendChild(document.createTextNode(text.slice(cursor)));
    }

    function renderResults(matched, query) {
        results.replaceChildren();

        if (matched.length === 0) {
            status.textContent = 'No results found.';
            return;
        }

        status.textContent = 'Found ' + matched.length + (matched.length === 1 ? ' result.' : ' results.');
        var list = document.createElement('ul');

        matched.forEach(function(item) {
            var listItem = document.createElement('li');
            var link = document.createElement('a');
            link.href = item.slug;
            appendHighlightedText(link, item.title, query);

            var meta = document.createElement('div');
            meta.className = 'search-result-meta';
            meta.textContent = item.date + (item.categories ? ' · ' + item.categories : '');

            listItem.appendChild(link);
            listItem.appendChild(meta);
            list.appendChild(listItem);
        });

        results.appendChild(list);
    }

    function doSearch(query) {
        var normalized = query.trim().toLowerCase();
        if (!normalized) {
            status.textContent = '';
            results.replaceChildren();
            return;
        }
        if (searchData.length === 0) {
            status.textContent = 'Loading search index...';
            return;
        }

        var matched = searchData.filter(function(item) {
            return item.title.toLowerCase().includes(normalized) ||
                item.content.toLowerCase().includes(normalized) ||
                (item.categories && item.categories.toLowerCase().includes(normalized)) ||
                (item.tags && item.tags.toLowerCase().includes(normalized));
        });
        renderResults(matched, query.trim());
    }

    fetch('{{ "index.json" | relURL }}')
        .then(function(response) {
            if (!response.ok) throw new Error('Search index request failed');
            return response.json();
        })
        .then(function(data) {
            searchData = data;
            var keyword = new URLSearchParams(window.location.search).get('keyword');
            if (keyword) input.value = keyword;
            doSearch(input.value);
        })
        .catch(function() {
            status.textContent = 'Failed to load search index.';
        });

    input.addEventListener('input', function() {
        window.clearTimeout(timer);
        timer = window.setTimeout(function() { doSearch(input.value); }, 120);
    });

    var sidebarButton = document.getElementById('searchSidebarToggle');
    sidebarButton.addEventListener('click', function() {
        var sidebar = document.querySelector('.right-sidebar');
        if (!sidebar) return;
        var visible = sidebar.classList.toggle('sidebar-visible');
        sidebarButton.setAttribute('aria-expanded', String(visible));
    });
})();
</script>

{{- partial "footer/footer" . -}}
{{ end }}

{{ define "right-sidebar" }}
{{ partial "sidebar/right.html" (dict "Context" . "Scope" "page") }}
{{ end }}
