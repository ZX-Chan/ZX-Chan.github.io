<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 满屏情话</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #fff5f7; height: 100vh; font-family: 'Microsoft YaHei UI','Segoe UI',sans-serif; cursor: pointer; user-select: none; }
        .msg { position: fixed; padding: 10px 22px; border-radius: 30px; font-size: 1.2rem; font-weight: 600; color: #333; opacity: 0; pointer-events: none; box-shadow: 0 4px 15px rgba(0,0,0,0.08); white-space: nowrap; z-index: 10; transform: scale(0.3) translateY(30px); transition: opacity .5s ease,transform .5s ease; }
        .msg.show { opacity: .9; transform: scale(1) translateY(0); }
        .hint { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); color: #d4818e; font-size: 1rem; opacity: .6; z-index: 100; text-align: center; }
        .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; display: none; align-items: center; gap: 12px; background: rgba(255,255,255,.85); backdrop-filter: blur(8px); padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
        .controls label { font-size: .85rem; color: #68495b; font-weight: 600; }
        .controls input[type=range] { width: 120px; accent-color: #d4818e; cursor: pointer; }
        .controls .speed-label { font-size: .85rem; color: #d4818e; min-width: 45px; font-weight: 600; }
    </style>
</head>
<body>
<a href="../" style="position:fixed;top:20px;left:20px;z-index:999;background:rgba(255,255,255,.8);border:none;border-radius:12px;padding:8px 16px;font-size:1rem;cursor:pointer;text-decoration:none;color:#68495b;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.08)">← 返回</a>
<div class="hint">💕 点击屏幕开始</div>
<div class="controls">
<button id="stopBtn" style="background:#d4818e;border:none;border-radius:20px;padding:6px 16px;font-size:.85rem;cursor:pointer;color:#fff;font-weight:bold">■ 停止</button>
<label>频率</label>
<input type="range" id="freqSlider" min="1" max="100" value="75">
<span class="speed-label" id="speedLabel"></span>
</div>
<script>
const messages=["我想你了 💭","今天过得开心嘛 🌸","期待和你见面 🥰","顺顺利利 ✨","早点休息 🌙","天冷了，多穿衣服 🧣","今天有想我嘛 💗","我爱你 ❤️","宝贝 💕","你要想我 😘","我好想你 🥺","我真的好想你 😭","宝宝我爱你 💖","小欣宝宝 🐣","小欣宝贝 🌷","好爱你w 💝","亲亲宝贝 😽","要抱抱~ 🤗","比心❤️","啾咪~ 💋","喜欢喜欢喜欢 💫","你是我的全世界 🌍","遇见你真好 💞","每天都想见你 ☀️","晚安我的宝贝 🌙","早安呀 🌄","你今天真好看 ✨","想牵你的手 🫶","你是我最幸运的事 🍀","好想抱抱你 🫂","你笑起来真好看 😊","你是我的小确幸 🌈","有你在真好 💝","我最喜欢你了 🌟","你是我的唯一 💎","想和你一起看日落 🌅","永远在一起 🤞","今天也想你了 💭","你好可爱呀 🥹","给你一个大大的拥抱 🫂","我的心里只有你 💘","想陪你走过每一天 📅","你是我的阳光 ☀️","好想见你一面 😣","你在我心里是最美 🌹","要一直幸福下去 💑","我好喜欢你啊 💗","每天多爱你一点 📈","你是我的宝藏 🏆","想你了呀 🥺"];
const colors=["#FFB6C1","#FFC8DC","#FFDAB9","#FFE4E1","#FF6F91","#FFF0F5","#FFBE96","#FF9671","#FFC75F","#FFF5C8","#FFFAE6","#F9F871","#98FB98","#90EE90","#ADFF2F","#B9FAC8","#BDFCC8","#FFF","#ADD8E6","#B0E0E6","#87CEFA","#B0EEEE","#B4D2FF","#D2E1F0","#E0FFFF","#A078DF","#BE93FD","#D65DB1","#DCC0FF","#EE82EE","#DDA0DD","#FACCFF","#FFE6FF","#DCC8FF"];
const speedNames=[[20,"极慢"],[40,"慢"],[60,"中"],[80,"快"],[95,"很快"],[100,"极快"]];
let active=false,running=true,msgCount=0,intervalId=null;
const MAX=200,sl=document.getElementById('freqSlider'),lab=document.getElementById('speedLabel');
function rd(a){return a[Math.floor(Math.random()*a.length)]}
function gi(){return Math.round(500-(parseInt(sl.value)/100)*485)}
function ul(){const v=parseInt(sl.value);let n="极快";for(const[t,l]of speedNames){if(v<=t){n=l;break}}lab.textContent=n}
sl.addEventListener('input',function(){ul();if(active){clearInterval(intervalId);intervalId=setInterval(cm,gi())}});
function cm(){if(!running||msgCount>=MAX)return;const e=document.createElement('div');e.className='msg';e.textContent=rd(messages);e.style.background=rd(colors);e.style.left=Math.random()*(innerWidth-200)+'px';e.style.top=Math.random()*(innerHeight-60)+'px';document.body.appendChild(e);msgCount++;e.offsetHeight;e.classList.add('show');setTimeout(()=>{e.classList.remove('show');e.style.opacity='0';e.style.transform='scale(0.3) translateY(30px)';setTimeout(()=>{if(e.parentNode)e.remove();msgCount--},500)},2000+Math.random()*2000)}
function sr(){if(active)return;active=true;document.querySelector('.hint').style.display='none';document.querySelector('.controls').style.display='flex';for(let i=0;i<20;i++)setTimeout(cm,i*100);intervalId=setInterval(cm,gi())}
document.getElementById('stopBtn').addEventListener('click',function(e){e.stopPropagation();if(active){running=false;clearInterval(intervalId);document.querySelectorAll('.msg').forEach(el=>{el.classList.remove('show');el.style.opacity='0';setTimeout(()=>el.remove(),500)});active=false;this.textContent='▶ 开始'}else{running=true;active=true;intervalId=setInterval(cm,gi());for(let i=0;i<15;i++)setTimeout(cm,i*100);this.textContent='■ 停止'}});
document.addEventListener('click',sr);ul();
</script>
</body>
</html>
