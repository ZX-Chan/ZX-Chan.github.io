<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 For You</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 2rem;
        }
        .nav-container {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        h1 { font-size: 2.2rem; color: #d4818e; margin-bottom: 0.5rem; }
        .subtitle { font-size: 1rem; color: #888; margin-bottom: 2.5rem; }
        .game-list { display: flex; flex-direction: column; gap: 1rem; }
        .game-btn {
            display: block; padding: 1.2rem 1.5rem;
            background: #fff; border: 2px solid #f1d5da;
            border-radius: 16px; text-decoration: none;
            color: #68495b; font-size: 1.15rem; font-weight: 600;
            transition: all 0.25s ease;
        }
        .game-btn:hover {
            background: #fce4ec; border-color: #d4818e;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212,129,142,0.2);
        }
        .game-btn .icon { font-size: 1.5rem; margin-right: 0.5rem; }
        .back-home {
            display: inline-block; margin-top: 1.5rem;
            background: transparent; border: 2px solid #f1d5da; border-radius: 16px;
            padding: 0.8rem 1.5rem; font-size: 0.95rem; cursor: pointer; text-decoration: none;
            color: #68495b; font-weight: 600; transition: all 0.25s ease;
        }
        .back-home:hover {
            background: #fce4ec; border-color: #d4818e;
        }
    </style>
</head>
<body>
    <div class="nav-container">
        <h1>💖 小游戏</h1>
        <p class="subtitle">Choose a game to play 💕</p>
        <div class="game-list">
            <a href="confession/" class="game-btn">
                <span class="icon">💌</span> 可以成为我的恋人吗？
            </a>
            <a href="messages/" class="game-btn">
                <span class="icon">💬</span> 满屏情话
            </a>
            <a href="catch-hearts/" class="game-btn">
                <span class="icon">🎮</span> 接住爱心
            </a>
            <a href="anniversary/" class="game-btn">
                <span class="icon">📅</span> 纪念日
            </a>
        </div>
        <a href="../" class="back-home">🏠 回到主页</a>
    </div>
</body>
</html>
